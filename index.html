
<!DOCTYPE html>

  <!-- Hero Section com Imagem -->

  <!-- Experience Carousel -->

    <p><i class="fa-solid fa-phone"></i> +55 11 94796-1874</p>

    <h2>Envie uma mensagem</h2>

      <textarea name="message" placeholder="Sua mensagem" required></textarea>

    </form>
